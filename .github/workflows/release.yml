name: Release

on:
  push:
    tags:
      - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: npm
    - name: Download JDKs
      run: |
        ./scripts/download_linux_jdk.sh
        ./scripts/download_windows_jdk.sh
        ./scripts/download_mac_jdk.sh
        ./scripts/link_linux.sh
        ./scripts/link_windows.sh
        ./scripts/link_mac.sh
    - name: Fetch node dependencies
      run: npm install
    - name: Build Java
      run: |
        bazel build //:java-language-server
        mkdir -p dist/classpath
        cp bazel-bin/java-language-server.jar dist/classpath/
        cp ~/.m2/repository/com/google/code/gson/gson/2.8.9/gson-2.8.9.jar dist/classpath/
        cp ~/.m2/repository/com/google/protobuf/protobuf-java/3.19.6/protobuf-java-3.19.6.jar dist/classpath/
    - name: Build extension
      run: npm run-script vscode:build
    - name: Publish extension in VSCode marketplace
      run: npx vsce publish --pat ${{ secrets.MARKETPLACE_TOKEN }} --packagePath build.vsix